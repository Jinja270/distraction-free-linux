# ==============================================================================
# Distraction-Free Linux (Study OS) - Kernel Module Blacklist
# Target: /etc/modprobe.d/wireguard-lockdown.conf
# Purpose: Prevent loading of WireGuard in-kernel network driver to stop VPN evasion
# Permissions: 0444 root:root (chattr +i)
# ==============================================================================

# Disable automatic module loading by kernel alias
blacklist wireguard

# Override modprobe invocation with a no-op returning exit code 0
# Neutralizes direct 'modprobe wireguard' and 'ip link add type wireguard'
install wireguard /bin/true
