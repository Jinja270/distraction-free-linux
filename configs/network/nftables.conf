#!/usr/sbin/nft -f

# ==============================================================================
# Distraction-Free Linux (Study OS) - Production nftables Firewall Configuration
# Target: /etc/nftables.conf
# Architecture: Dual-stack IPv4/IPv6 unified filtering
# Purpose: Prevent DNS bypass (DoT, DoH, direct UDP 53) and proxy/VPN evasion
# ==============================================================================

flush ruleset

table inet filter {
    # --------------------------------------------------------------------------
    # Set of Public Anycast DNS-over-HTTPS (DoH) IPv4 Endpoints
    # Dropped on TCP port 443 to prevent browser/tool DoH tunnel bootstrapping
    # --------------------------------------------------------------------------
    set doh_ipv4 {
        type ipv4_addr
        flags interval
        elements = {
            1.1.1.1, 1.0.0.1, 1.1.1.2, 1.0.0.2, 1.1.1.3, 1.0.0.3,                          # Cloudflare (Primary & Family/Malware)
            162.159.36.1, 162.159.46.1, 162.159.131.53, 162.159.132.53,
            8.8.8.8, 8.8.4.4,                                                               # Google Public DNS
            9.9.9.9, 9.9.9.10, 9.9.9.11,                                                    # Quad9 (Standard & Unsecured/ECS)
            149.112.112.112, 149.112.112.9, 149.112.112.10, 149.112.112.11,
            208.67.222.222, 208.67.220.220, 208.67.222.123, 208.67.220.123,                # OpenDNS / Cisco
            94.140.14.14, 94.140.15.15, 94.140.14.15, 94.140.15.16,                         # AdGuard (Default & Family)
            94.140.14.140, 94.140.14.141,                                                  # AdGuard Non-filtering
            194.242.2.2, 194.242.2.3, 194.242.2.4, 194.242.2.5, 194.242.2.9,               # Mullvad DoH
            76.76.2.0, 76.76.10.0, 76.76.2.1, 76.76.10.1, 76.76.2.2, 76.76.10.2,           # Control D
            185.228.168.9, 185.228.169.9, 185.228.168.10, 185.228.169.10,                  # CleanBrowsing
            45.90.28.0, 45.90.30.0                                                          # NextDNS
        }
    }

    # --------------------------------------------------------------------------
    # Set of Public Anycast DNS-over-HTTPS (DoH) IPv6 Endpoints
    # Dropped on TCP port 443 to prevent IPv6 DoH tunnel bootstrapping
    # --------------------------------------------------------------------------
    set doh_ipv6 {
        type ipv6_addr
        flags interval
        elements = {
            2606:4700:4700::1111, 2606:4700:4700::1001, 2606:4700:4700::0064, 2606:4700:4700::6400, # Cloudflare
            2001:4860:4860::8888, 2001:4860:4860::8844,                                             # Google
            2620:fe::fe, 2620:fe::9, 2620:fe::10, 2620:fe::11,                                       # Quad9
            2620:119:35::35, 2620:119:53::53,                                                       # OpenDNS
            2a10:50c0::ad1:ff, 2a10:50c0::ad2:ff,                                                   # AdGuard
            2a07:e340::2,                                                                            # Mullvad
            2606:1a40::, 2606:1a40:1::,                                                             # Control D
            2a0d:2a00:1::2, 2a0d:2a00:2::2,                                                         # CleanBrowsing
            2a07:a8c0::, 2a07:a8c1::                                                                # NextDNS
        }
    }

    # --------------------------------------------------------------------------
    # Prohibited Tunneling, VPN, and Proxy Ports (TCP/UDP)
    # Blocks WireGuard, OpenVPN, Tor, SOCKS, and Proxy protocol evasion
    # --------------------------------------------------------------------------
    set blocked_tunnel_ports {
        type inet_service
        elements = {
            1194,   # OpenVPN default port
            51820,  # WireGuard default port
            9001,   # Tor ORPort / relay
            9050,   # Tor standard SOCKS5
            9051,   # Tor control port
            9150,   # Tor Browser SOCKS5
            1080,   # Generic SOCKS4 / SOCKS5 proxy port
            3128    # Squid / HTTP proxy default
        }
    }

    # --------------------------------------------------------------------------
    # Input Chain (Inbound Protection)
    # Default Policy: DROP (Complete host shielding against inbound probing)
    # --------------------------------------------------------------------------
    chain input {
        type filter hook input priority filter; policy drop;

        # Accept loopback traffic
        iif "lo" accept

        # Accept established and related inbound connections
        ct state established,related accept

        # Drop invalid packets
        ct state invalid drop

        # Allow ICMP and ICMPv6 for path MTU discovery, ping, and IPv6 NDP
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept
    }

    # --------------------------------------------------------------------------
    # Forward Chain (No routing/bridging)
    # Default Policy: DROP
    # --------------------------------------------------------------------------
    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    # --------------------------------------------------------------------------
    # Output Chain (Strict Egress Policy & DNS Lockdown)
    # Default Policy: DROP (Restricted egress to permitted study protocols)
    # --------------------------------------------------------------------------
    chain output {
        type filter hook output priority filter; policy drop;

        # 1. Allow loopback egress unconditionally
        oif "lo" accept

        # 2. Accept established and related connections
        ct state established,related accept

        # 3. Drop invalid packets
        ct state invalid drop

        # 4. Allow ICMP / ICMPv6 for path MTU discovery and diagnostic ping
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        # 5. Allow DHCP client traffic for network acquisition (IPv4 & IPv6)
        udp sport 68 udp dport 67 accept
        udp sport 546 udp dport 547 accept

        # 6. Allow Network Time Protocol (NTP) synchronization
        udp dport 123 accept

        # 7. DNS Lockdown: Restrict direct Port 53 DNS queries to system resolver & root
        # Only systemd-resolve (UID 100..105) and root (UID 0) can query external DNS.
        # Direct port 53 queries from unprivileged users (UID >= 1000) are dropped.
        meta skuid { 0, 100, 101, 102, 103, 104, 105 } udp dport 53 accept
        meta skuid { 0, 100, 101, 102, 103, 104, 105 } tcp dport 53 accept

        # 8. Explicit DNS-over-TLS (DoT port 853) drop rules (TCP and UDP)
        tcp dport 853 drop
        udp dport 853 drop

        # 9. Drop prohibited tunneling, VPN, and proxy ports (TCP and UDP)
        tcp dport @blocked_tunnel_ports drop
        udp dport @blocked_tunnel_ports drop

        # 10. Drop outbound connections to known public DoH Anycast endpoints on port 443
        ip daddr @doh_ipv4 tcp dport 443 drop
        ip6 daddr @doh_ipv6 tcp dport 443 drop

        # 11. Allow standard web traffic: HTTP (port 80) and HTTPS (port 443)
        # Note: DoH endpoints on 443 are dropped by rule 10 prior to reaching this accept rule.
        tcp dport { 80, 443 } accept

        # All other outbound traffic is dropped by the default chain policy
    }
}
