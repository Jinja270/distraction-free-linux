# LightDM zero-second passwordless autologin configuration for Distraction-Free Linux (Study OS)
# Injected into /etc/lightdm/lightdm.conf.d/50-autologin.conf

[Seat:*]
autologin-user=study
autologin-user-timeout=0
autologin-session=xfce
user-session=xfce
greeter-session=lightdm-gtk-greeter
greeter-hide-users=true
session-cleanup-script=/usr/bin/pkill -u study -9
