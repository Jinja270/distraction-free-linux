# ==============================================================================
# Distraction-Free Linux (Study OS) - Ventoy & Loopback GRUB Configuration
# File: configs/boot/loopback.cfg
# Purpose: Loopback ISO bootloader configuration for Ventoy and loopback chainloaders.
# ==============================================================================

set default="0"
set timeout=5

# Visual and Graphical Terminal Configuration
set gfxmode=auto
insmod efi_gop
insmod efi_uga
insmod video_bochs
insmod video_cirrus
insmod all_video
insmod font
insmod gfxterm

# Color scheme
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

# ------------------------------------------------------------------------------
# 1. Ventoy / Loopback Amnesic RAM Boot (Default)
# ------------------------------------------------------------------------------
menuentry "Distraction-Free Linux (Ventoy / ISO Boot in RAM - 100% Amnesic)" {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper iso-scan/filename=${iso_path} toram quiet splash systemd.gpt_auto=0 noswap layerfs=overlayfs ---
    initrd /casper/initrd
}

# ------------------------------------------------------------------------------
# 2. Ventoy / Loopback Persistent Study Boot
# ------------------------------------------------------------------------------
menuentry "Distraction-Free Linux (Ventoy / ISO Boot with Study Persistence)" {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper iso-scan/filename=${iso_path} toram persistent quiet splash systemd.gpt_auto=0 noswap layerfs=overlayfs ---
    initrd /casper/initrd
}

# ------------------------------------------------------------------------------
# 3. Ventoy / Loopback Safe Graphics Fallback
# ------------------------------------------------------------------------------
menuentry "Distraction-Free Linux (Ventoy / ISO Safe Graphics / Low RAM)" {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper iso-scan/filename=${iso_path} nomodeset quiet splash systemd.gpt_auto=0 noswap ---
    initrd /casper/initrd
}
