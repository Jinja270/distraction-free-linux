# ==============================================================================
# Distraction-Free Linux (Study OS) - Primary GRUB 2 Configuration
# File: configs/boot/grub.cfg
# Purpose: Live bootloader menu supporting amnesic RAM execution, study persistence,
#          dual UEFI/BIOS video modes, and complete host disk isolation.
# ==============================================================================

set default="0"
set timeout=5

# Visual and Graphical Terminal Configuration
set gfxmode=auto
insmod efi_gop
insmod efi_uga
insmod video_bochs
insmod video_cirrus
insmod all_video
insmod font
insmod gfxterm

if loadfont /boot/grub/fonts/unicode.pf2 ; then
    set gfxmode=auto
    set gfxpayload=keep
    terminal_output gfxterm
fi

# Color scheme (distraction-free monochromatic styling)
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

# ------------------------------------------------------------------------------
# 1. Default Amnesic RAM Boot (100% Volatile - Leaves zero trace on host)
# ------------------------------------------------------------------------------
menuentry "Distraction-Free Linux (Live in RAM - 100% Amnesic)" {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper toram quiet splash systemd.gpt_auto=0 noswap layerfs=overlayfs ---
    initrd /casper/initrd
}

# ------------------------------------------------------------------------------
# 2. Persistent Study Boot (Amnesic root + Persistent notes/materials)
# ------------------------------------------------------------------------------
menuentry "Distraction-Free Linux (Live in RAM + Study Persistence)" {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper toram persistent quiet splash systemd.gpt_auto=0 noswap layerfs=overlayfs ---
    initrd /casper/initrd
}

# ------------------------------------------------------------------------------
# 3. Safe Graphics / Low RAM Fallback Mode
# ------------------------------------------------------------------------------
menuentry "Distraction-Free Linux (Safe Graphics / Low RAM)" {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper nomodeset quiet splash systemd.gpt_auto=0 noswap ---
    initrd /casper/initrd
}

# ------------------------------------------------------------------------------
# 4. UEFI Firmware Settings (if booted under UEFI)
# ------------------------------------------------------------------------------
if [ "$grub_platform" = "efi" ]; then
    menuentry "UEFI Firmware Settings" {
        fwsetup
    }
fi
